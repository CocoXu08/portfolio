<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
</head>

<main>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>
</main>

<div style="display: flex; align-items: baseline;">
  <label for="commit-progress" style="margin-right: 0.75rem; white-space: nowrap;">
    Show commits until:
  </label>

  <input
    type="range"
    id="commit-progress"
    min="0"
    max="100"
    value="100"
    style="flex: 1; margin-right: 0.75rem;"
  />

  <time id="commit-time"></time>
</div>





<div id="stats" class="card">
  <h2>Summary</h2>
</div>


<dl id="files">
  <!-- we want the following structure for each file:
  <div>
    <dt>
      <code>{file.name}</code>
    </dt>
    <dd>{file.lines.length} lines</dd>
  </div>
  -->
</dl>

<script type="module" src="../global.js"></script>
<script type="module" src="main.js"></script>

<h1>Commits by time of day</h1>


<div id="scrolly-1">
  <div id="scatter-story">
    Here are my Commits!
  </div>

  <div id="scatter-plot">
    <div id="chart"></div>


    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank" rel="noopener noreferrer"></a></dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time-tooltip"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>

    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
  </div>
</div>



</body>
</html>
